<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<!-- Política de segurança: o app só pode carregar os próprios arquivos e não pode enviar dados para nenhum servidor -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'none'; worker-src 'self'; manifest-src 'self'; font-src 'self'; object-src 'none'; frame-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#0f1115">
<meta name="color-scheme" content="dark">
<title>Tetto</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header><div class="in">
  <h1 id="hTitle">Tetto</h1>
  <div class="sub" id="hSub" hidden></div>
  <div class="mnav" id="mnav">
    <button class="arw" id="mPrev" aria-label="Mês anterior"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg></button>
    <button class="dcur" id="mCur" aria-label="Ir para o mês atual"><b id="mLabel"></b><span id="mSub"></span></button>
    <button class="arw" id="mNext" aria-label="Próximo mês"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg></button>
  </div>
  <div class="seg" id="seg" role="tablist">
    <button id="mMes" role="tab">No mês</button>
    <button id="mHoje" role="tab">Hoje</button>
  </div>
</div></header>

<main class="in">
  <section id="view-home"></section>
  <section id="view-list" hidden></section>
  <section id="view-cards" hidden></section>
  <section id="view-budget" hidden></section>
  <section id="view-more" hidden></section>
</main>

<button class="fab" id="fab" aria-label="Novo lançamento">+</button>

<nav><div class="in">
  <button data-tab="home" class="on"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-7 9 7"/><path d="M5 10v10h14V10"/><path d="M10 20v-6h4v6"/></svg>Início</button>
  <button data-tab="list"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg>Lançamentos</button>
  <button data-tab="cards"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="5" width="19" height="14" rx="3"/><path d="M2.5 10h19M6.5 15h4"/></svg>Cartões</button>
  <button data-tab="budget"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 18a8 8 0 1 1 16 0"/><path d="M12 18l4-5"/><path d="M4 18h16"/></svg>Orçamento</button>
  <button data-tab="more"><svg viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="19" cy="12" r="1.8"/></svg>Mais</button>
</div></nav>

<div class="backdrop" id="backdrop"></div>
<div class="sheet" id="acts" role="dialog" aria-modal="true" aria-labelledby="actsTitle">
  <div class="grab"></div>
  <h2 id="actsTitle">O que você quer lançar?</h2>
  <div class="actgrid">
    <button type="button" data-m="r"><span>💰</span>Receita</button>
    <button type="button" data-m="d"><span>💸</span>Despesa</button>
    <button type="button" data-m="c"><span>💳</span>Compra no cartão</button>
    <button type="button" data-m="i"><span>📈</span>Investir</button>
    <button type="button" data-m="t" class="wide"><span>⇄</span>Transferir ou pagar fatura</button>
  </div>
</div>
<form class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle" autocomplete="off">
  <div class="grab"></div>
  <h2 id="sheetTitle">Novo lançamento</h2>
  <div class="amt"><span id="curSym">R$</span><input id="fAmount" inputmode="decimal" enterkeyhint="done" placeholder="0,00" aria-label="Valor"></div>
  <div id="fCatBox">
    <div class="lbl">Categoria</div><div class="chips" id="fCats"></div>
    <div class="lbl">Subcategoria</div><div class="chips" id="fSubs"></div>
    <div class="tetoln" id="fTeto" hidden></div>
  </div>
  <label><span id="fContaLbl">Pago com</span><select id="fConta"></select></label>
  <label id="fParaL"><span id="fParaLbl">Para</span><select id="fPara"></select></label>
  <label id="fFatL" hidden>Qual fatura<select id="fFat"></select><span class="s" id="fFatHint" style="display:block;margin-top:6px"></span></label>
  <label id="fParcL">Parcelas<select id="fParc"></select><span class="s" id="fParcHint" style="display:block;margin-top:6px"></span></label>
  <label id="fRepL">Repetir<select id="fRep"><option value="0">Não repetir</option><option value="1">Todo mês</option></select><span class="s" id="fRepHint" style="display:block;margin-top:6px"></span></label>
  <div id="fPagoBox"><div class="lbl">Situação</div><div class="mini" id="fPago"><button type="button" data-pg="1">Pago</button><button type="button" data-pg="0">Pendente</button></div></div>
  <div class="hl" id="fParcInfo" hidden></div>
  <label>Data<input type="date" id="fData"></label>
  <label>Descrição (opcional)<input id="fDesc" maxlength="60" placeholder="ex.: almoço, conta de luz" enterkeyhint="done"></label>
  <button class="btn paybtn" type="button" id="fPagar" hidden>✓ Marcar como pago</button>
  <button class="btn ghost" type="button" id="fEstornar" hidden>↩ Estornar esta compra</button>
  <button class="btn primary" type="submit">Salvar</button>
  <button class="btn danger" type="button" id="fDel">Excluir lançamento</button>
</form>
<div class="sheet" id="msheet" role="dialog" aria-modal="true" aria-labelledby="mTitle">
  <div class="grab"></div>
  <h2 id="mTitle">Contas e investimentos</h2>
  <div id="mBody"></div>
</div>
<div class="sheet" id="picker" role="dialog" aria-modal="true" aria-labelledby="pkTitle">
  <div class="grab"></div>
  <h2 id="pkTitle">Ícone e cor</h2>
  <div class="pkprev"><span class="ico" id="pkIco"></span><b id="pkName"></b></div>
  <div id="pkColorBox"><div class="lbl">Cor</div><div class="colors" id="pkColors"></div></div>
  <div class="lbl">Ícone</div>
  <div class="emogrid" id="pkGrid"></div>
  <button class="btn primary" type="button" id="pkDone">Concluir</button>
</div>
<div class="dlg" id="dlg" role="alertdialog" aria-modal="true" aria-labelledby="dlgT"><div class="dlgbox"><div class="dlgt" id="dlgT"></div><div class="dlgm" id="dlgM"></div><div id="dlgB"></div></div></div>
<input type="file" id="fileIn" hidden>
<div class="toast" id="toast"></div>

<script src="app.js"></script>
</body>
</html>
